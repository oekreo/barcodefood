<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>باركود فود | المنيو والتوصيل</title>
    <meta name="description" content="منيو باركود فود — للوجبات السريعة." />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #b5384a;
        --red-deep: #922b3b;
        --gold: #eec14d;
        --gold-wash: #fbf2d9;
        --ink: #30282a;
        --muted: #817779;
        --bg: #f5f3ef;
        --surface: #fff;
        --line: #e9e4df;
        --shadow: 0 8px 24px #30282a0d;
        --header-height: 58px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 130px;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Cairo", Tahoma, sans-serif;
        line-height: 1.65;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }
      header {
        height: var(--header-height);
        position: sticky;
        top: 0;
        z-index: 12;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 6px max(16px, calc((100vw - 1120px) / 2));
        background: #f5f3eff2;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .lg {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--red);
        font-size: 16px;
        font-weight: 800;
        white-space: nowrap;
      }
      .lg img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      .cartbtn {
        border: 0;
        border-radius: 24px;
        padding: 6px 13px;
        color: white;
        background: var(--red);
        font-weight: 800;
      }
      .cartbtn:hover,
      .add:hover {
        background: var(--red-deep);
      }
      .hero {
        text-align: center;
        padding-bottom: 18px;
      }
      .banner {
        position: relative;
        height: clamp(190px, 52vw, 360px);
        overflow: hidden;
        background: #493536;
      }
      .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.65s ease;
      }
      .slide.on {
        opacity: 1;
      }
      .banner:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #1d171a66, transparent 70%);
        pointer-events: none;
      }
      .dots {
        position: absolute;
        z-index: 1;
        bottom: 13px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 7px;
      }
      .dots button {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #ffffff99;
      }
      .dots button.on {
        width: 20px;
        border-radius: 8px;
        background: white;
      }
      .brand-mark {
        position: relative;
        z-index: 2;
        width: 102px;
        height: 102px;
        margin: -52px auto 0;
        padding: 5px;
        border: 4px solid white;
        border-radius: 50%;
        background: white;
        box-shadow: 0 8px 24px #23171930;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      .hero h1 {
        margin-top: 6px;
        color: var(--red);
        font-size: clamp(30px, 8vw, 46px);
        font-weight: 800;
        line-height: 1.35;
      }
      .hero p {
        margin: 2px 0 12px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .chip {
        padding: 5px 13px;
        border: 1px solid #e8dfd3;
        border-radius: 24px;
        background: white;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
      }
      .sec {
        max-width: 1120px;
        margin: auto;
        padding: 24px 16px;
      }
      .sec h2 {
        color: var(--red);
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 800;
        line-height: 1.4;
      }
      .sec h2:after {
        content: "";
        display: block;
        width: 38px;
        height: 3px;
        margin-top: 7px;
        border-radius: 4px;
        background: var(--gold);
      }
      .sub {
        margin: 6px 0 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .search-wrap {
        max-width: 720px;
        margin: 8px auto 0;
        padding: 0 16px 12px;
      }
      .searchbox {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: white;
        box-shadow: 0 4px 16px #30282a08;
      }
      .searchbox span {
        color: var(--muted);
        font-size: 20px;
      }
      .searchbox input {
        width: 100%;
        border: 0;
        outline: none;
        color: var(--ink);
        background: transparent;
        font-size: 14px;
      }
      .category-shell {
        position: sticky;
        top: var(--header-height);
        z-index: 10;
        padding: 9px 0 10px;
        background: #f5f3eff2;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid #e9e4dfb8;
      }
      .category-tiles {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 0 16px 2px;
        scrollbar-width: none;
      }
      .category-tiles::-webkit-scrollbar,
      .offers::-webkit-scrollbar {
        display: none;
      }
      .category-tile {
        position: relative;
        flex: 0 0 102px;
        height: 112px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 8px 5px;
        border: 2px solid transparent;
        border-radius: 18px;
        color: white;
        background: linear-gradient(145deg, #dfc5a5, #9d786d);
        box-shadow: 0 4px 12px #30282a14;
        isolation: isolate;
      }
      .category-tile img {
        position: absolute;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .category-tile:after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 20% 0 0;
        background: linear-gradient(transparent, #171316d9);
      }
      .category-tile .tile-emoji {
        position: absolute;
        inset: 0 0 16px;
        z-index: -1;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #f8e9ca, #d5b9ab);
        font-size: 40px;
      }
      .category-tile b {
        font-size: 12px;
        white-space: nowrap;
      }
      .category-tile.on {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px #eec14d55;
      }
      .category-tile.all {
        background: linear-gradient(145deg, #59464a, #20191c);
      }
      .category-tile.all:after {
        display: none;
      }
      .offers {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding: 2px 1px 10px;
        scrollbar-width: none;
        scroll-snap-type: x mandatory;
      }
      .of {
        flex: 0 0 min(78vw, 285px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: white;
        box-shadow: var(--shadow);
        scroll-snap-align: start;
      }
      .offer-picture {
        position: relative;
      }
      .of img {
        display: block;
        width: 100%;
        height: 165px;
        object-fit: cover;
      }
      .discount {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 3px 9px;
        border-radius: 16px;
        color: white;
        background: #30282a;
        font-size: 12px;
        font-weight: 800;
      }
      .of .bd {
        padding: 12px 14px 14px;
      }
      .of h3 {
        font-size: 15px;
        font-weight: 800;
      }
      .of small {
        display: block;
        min-height: 24px;
        color: var(--muted);
        font-size: 12px;
      }
      .offer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 9px;
      }
      .of b {
        color: var(--red);
        font-size: 17px;
      }
      .old-price {
        margin-inline-start: 5px;
        color: var(--muted);
        font-size: 12px;
        text-decoration: line-through;
      }
      .offer-add {
        border: 0;
        border-radius: 20px;
        padding: 6px 12px;
        color: white;
        background: var(--red);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      #menu {
        padding-top: 20px;
      }
      .menu-category {
        margin: 0 0 26px;
        scroll-margin-top: 194px;
      }
      .category-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .category-name {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-size: 19px;
        font-weight: 800;
      }
      .category-name img,
      .category-name .heading-emoji {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: white;
        object-fit: cover;
        font-size: 20px;
      }
      .item-count {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .menu-list {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: white;
        box-shadow: var(--shadow);
      }
      .card {
        display: flex;
        direction: ltr;
        gap: 12px;
        min-height: 126px;
        padding: 12px;
        border-bottom: 1px solid #eee9e5;
      }
      .card:last-child {
        border-bottom: 0;
      }
      .ph {
        position: relative;
        flex: 0 0 100px;
        width: 100px;
        height: 100px;
        overflow: visible;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: linear-gradient(145deg, #fffdfa, #f4e9d8);
      }
      .ph img {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        object-fit: cover;
      }
      .ph span {
        font-size: 44px;
      }
      .image-add {
        position: absolute;
        bottom: -5px;
        left: -5px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 3px solid white;
        border-radius: 50%;
        color: white;
        background: var(--red);
        font-size: 25px;
        line-height: 1;
        box-shadow: 0 3px 9px #30282a24;
      }
      .bd2 {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        direction: rtl;
        gap: 2px;
      }
      .bd2 h3 {
        color: var(--ink);
        font-size: 15px;
        font-weight: 800;
        line-height: 1.5;
      }
      .bd2 small {
        display: -webkit-box;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }
      .st {
        display: flex;
        align-items: center;
        align-self: flex-start;
      }
      .st button {
        padding: 0 1px;
        border: 0;
        color: #d9d0c5;
        background: none;
        font-size: 17px;
        line-height: 1;
      }
      .st button.on {
        color: var(--gold);
      }
      .st i {
        margin-inline-start: 5px;
        color: var(--muted);
        font-size: 10px;
        font-style: normal;
      }
      .row {
        margin-top: auto;
        padding-top: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pr {
        color: var(--red);
        font-size: 14px;
        font-weight: 800;
      }
      .sz {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .sz .add {
        border: 1px solid #eec14d88;
        border-radius: 18px;
        padding: 3px 8px;
        color: var(--red-deep);
        background: var(--gold-wash);
        font-size: 11px;
        font-weight: 700;
      }
      .sz u {
        margin-inline-end: 3px;
        text-decoration: none;
      }
      .no-results {
        padding: 30px 14px;
        color: var(--muted);
        text-align: center;
      }
      .contact-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .social-link {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--red);
        background: white;
        box-shadow: 0 3px 12px #30282a0a;
        font-size: 21px;
        text-decoration: none;
      }
      .social-link.whatsapp {
        border-color: #25d366;
        color: white;
        background: #25d366;
      }
      .social-link.location {
        border-color: var(--red);
        color: white;
        background: var(--red);
      }
      .contact-details {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .contact-details a {
        color: var(--red);
        font-weight: 700;
      }
      #phones {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      footer {
        margin-top: 20px;
        padding: 22px 18px;
        border-top: 3px solid var(--gold);
        color: #ffffffdf;
        background: var(--red);
        text-align: center;
        font-size: 13px;
      }
      .credit {
        margin-top: 6px;
        font-size: 12px;
      }
      .credit a {
        color: white;
        font-weight: 800;
      }
      .cart {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: flex-end;
        justify-content: center;
        background: #24191ab0;
        backdrop-filter: blur(3px);
      }
      .cart.open {
        display: flex;
      }
      .cp {
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow: auto;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 24px 24px 0 0;
        background: white;
        box-shadow: 0 -12px 40px #24191a20;
      }
      .ch,
      .ci,
      .qt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .ch button {
        border: 0;
        color: var(--red);
        background: none;
        font-size: 22px;
      }
      .ci {
        padding: 12px 0;
        border-bottom: 1px dashed var(--line);
      }
      .ci small {
        display: block;
        color: var(--red);
      }
      .qt button {
        width: 30px;
        height: 30px;
        border: 1.5px solid var(--red);
        border-radius: 50%;
        color: var(--red);
        background: none;
        font-size: 18px;
      }
      .tot {
        margin: 14px 0;
        font-size: 18px;
      }
      .tot b {
        color: var(--red);
      }
      #form {
        display: none;
      }
      #form input,
      #form textarea {
        width: 100%;
        margin-bottom: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: var(--bg);
      }
      #form .btn {
        width: 100%;
        padding: 10px 20px;
        border: 1px solid var(--red);
        border-radius: 40px;
        color: white;
        background: var(--red);
        text-align: center;
        font-weight: 700;
      }
      .toast {
        position: fixed;
        z-index: 30;
        inset-inline: 16px;
        bottom: 24px;
        display: none;
        padding: 12px 18px;
        border-radius: 14px;
        color: white;
        background: #35272af2;
        text-align: center;
        box-shadow: 0 8px 24px #35272a30;
      }
      @media (min-width: 760px) {
        :root {
          --header-height: 64px;
        }
        .hero {
          padding-bottom: 24px;
        }
        .brand-mark {
          width: 116px;
          height: 116px;
          margin-top: -58px;
        }
        .sec {
          padding: 30px 24px;
        }
        .of {
          flex-basis: 320px;
        }
        .card {
          gap: 16px;
          padding: 14px 16px;
        }
        .ph {
          flex-basis: 108px;
          width: 108px;
          height: 100px;
        }
        .menu-category {
          scroll-margin-top: 205px;
        }
      }
      @media (max-width: 380px) {
        .lg {
          gap: 5px;
          font-size: 14px;
        }
        .lg img {
          width: 32px;
          height: 32px;
        }
        nav {
          gap: 6px;
        }
        nav a {
          font-size: 11px;
        }
        .card {
          gap: 9px;
          padding: 10px;
        }
        .ph {
          flex-basis: 88px;
          width: 88px;
          height: 92px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="lg"><img src="logo.png" alt="" />باركود فود</div>
      <nav>
        <a href="#offers">العروض</a><a href="#menu">المنيو</a
        ><a href="#contact">الموقع</a>
        <button class="cartbtn" id="cartbtn">🛒 <b id="cnt">0</b></button>
      </nav>
    </header>

    <section class="hero" aria-label="باركود فود">
      <div class="banner" id="banner">
        <img class="slide on" src="offer1.jpg" alt="عرض باركود فود الأول" />
        <img class="slide" src="offer2.jpg" alt="عرض باركود فود الثاني" />
        <div class="dots" id="slide-dots" aria-label="شرائح العروض"></div>
      </div>
      <div class="brand-mark"><img src="logo.png" alt="شعار باركود فود" /></div>
      <h1 id="restaurant-name">باركود فود</h1>
      <p>بكل وقت موجود</p>
      <div class="chips">
        <span class="chip" id="delivery-chip" hidden></span>
        <span class="chip" id="minimum-chip" hidden></span>
      </div>
    </section>

    <div class="search-wrap">
      <label class="searchbox" for="menu-search">
        <span aria-hidden="true">⌕</span>
        <input
          id="menu-search"
          type="search"
          placeholder="ابحث عن وجبتك..."
          autocomplete="off"
        />
      </label>
    </div>
    <div class="category-shell">
      <div class="category-tiles" id="tabs" aria-label="أقسام المنيو"></div>
    </div>

    <section class="sec" id="offers">
      <h2>عروض مميزة</h2>
      <p class="sub">اختار عرضك المفضل</p>
      <div class="offers" id="offers-box"></div>
    </section>
    <section class="sec" id="menu">
      <h2>المنيو</h2>
      <p class="sub">الأسعار بالدينار العراقي</p>
      <div id="menu-sections"></div>
      <p class="no-results" id="no-results" hidden>لا توجد نتائج</p>
    </section>
    <section class="sec" id="contact">
      <h2>تواصل معنا</h2>
      <p class="sub">يسعدنا تواصلكم</p>
      <div class="contact-row" id="contact-links"></div>
      <div class="contact-details">
        <span id="addr"></span>
        <div id="phones"></div>
      </div>
    </section>
    <footer>
      <div>© باركود فود — جميع الحقوق محفوظة</div>
      <div class="credit">
        تصميم المنيو بواسطة
        <a href="https://instagram.com/narjizaen" target="_blank" rel="noopener"
          >@narjizaen</a
        >
        — لطلب تصميم أو للتواصل
      </div>
    </footer>

    <div class="cart" id="cart">
      <div class="cp">
        <div class="ch">
          <h3>🛒 سلة الطلبات</h3>
          <button id="cx" aria-label="إغلاق">✕</button>
        </div>
        <div id="items"></div>
        <div class="tot">المجموع: <b id="tot">0</b> د.ع</div>
        <div id="form">
          <input id="fn" placeholder="الاسم" />
          <input
            id="fp"
            placeholder="رقم الهاتف"
            inputmode="numeric"
            autocomplete="tel"
          />
          <input id="fa" placeholder="المنطقة / الحي" />
          <input id="fl" placeholder="أقرب نقطة دالة" />
          <textarea id="fz" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
          <button class="btn" id="send">إرسال الطلب عبر واتساب</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      // ============ الإعدادات (عدّلها من هنا) ============
      const CFG = {
        name: "باركود فود",
        wa: "9647741911911",
        phones: ["07741911911",  "07761911911"],
        address: "قطاع 20 قرب تقاطع الكيارة، بغداد",
        mapQuery: "تقاطع الكيارة قطاع 20 بغداد",
        mapUrl:
          "https://maps.apple.com/place?address=Alekiara%20Street,%20Baghdad,%20Iraq&coordinate=33.397144,44.437305&name=Alekiara%20Street&map=explore",
        insta: "barcode.foood",
        deliveryMin: "",
        minOrder: "",
        tiktok: "",

      // بيانات Firebase للتقييم المشترك (اتركها فارغة = التقييم يبقى بجهاز الزائر فقط)
      const FB = { apiKey: "", authDomain: "", projectId: "", appId: "" };
      // العروض: [الاسم, الوصف, السعر, الصورة]
      const OFFERS = [
        [
          "عرض الكنتاكي والبرگر",
          "دجاج مقرمش + برگر + فنكر + مشروب",
          10000,
          "offer1.jpg",
        ],
        ["عرض الميكس", "برگر + دجاج مقرمش + شاورما", 10000, "offer2.jpg"],

      // المنيو: القسم: [صورة القسم, [[الاسم, السعر أو 3 أسعار, ملاحظة, صورة خاصة]]]
      const T = ["كلاسك", "سبايسي", "مدخن"],
        N = "ببسي + صمون + ثومية";
      const M = {
        ساندويشات: [
          "sandwich",
          [
            ...T.map((t) => ["زنجر " + t, 3500]),
            ...["تويستر", "فلر"].flatMap((n) =>
              T.map((t) => [n + " " + t, 3500, "", "wrap"]),
            ),
            ["فاهيتا لحم", 4000, "", "wrap"],
            ["فاهيتا دجاج", 3500, "", "wrap"],
            [
              "هوت دوغ",
              3000,
              "طعم مشوي • جبنة ذائبة • مخلل وبصل مقرمش",
              "hotdog.jpeg",
            ],
          ],
        ],
        بيتزا: [
          "pizza",
          [
            ["بيتزا باركود", [7000, 10000, 15000]],
            ["بيتزا لحم", [6000, 9000, 14000]],
            ["بيتزا دجاج", [5000, 8000, 12000]],
            ["بيتزا فصول الأربعة", [6000, 9000, 14000]],
            ["بيتزا خضار", [5000, 7000, 10000]],
            ["بيتزا بيبروني", [5000, 7000, 10000]],
            ["بيتزا مارغريتا", [5000, 7000, 10000]],
          ],
        ],
        ريزو: [
          "bowl",
          [
            ["ريزو كلاسك", 5000],
            ["ريزو مدخن", 5000],
            ["ريزو سبايسي", 5000],
            ["ريزو مكس أعشاب", 5000],
            ["ريزو جبن", 6000],
            ["ريزو شاورما لحم", 6000],
            ["ريزو شاورما دجاج", 6000],
          ],
        ],
        برگر: [
          "burger",
          [
            ["برگر لحم كلاسك", 3000],
            ["برگر دجاج كلاسك", 3000, "", "chickenburger"],
            ["جيز برگر", 3500],
            ["سموكي برگر", 3500],
            ["سبايسي برگر", 3500],
            ["هاني ماسترد برگر", 3500],
          ],
        ],
        شاورما: [
          "wrap",
          [
            ["صاج شاورما دجاج", 2000],
            ["صاج شاورما لحم", 2500],
            ["ساندويش شاورما دجاج", 2000],
            ["ساندويش شاورما لحم", 2500],
            ["ربع كيلو دجاج", 5000],
            ["ربع كيلو لحم", 6000],
            ["نصف كيلو دجاج", 10000],
            ["نصف كيلو لحم", 12000],
            ["كيلو شاورما دجاج", 20000],
            ["كيلو شاورما لحم", 25000],
          ],
        ],
        كنتاكي: [
          "chicken",
          [
            ["كنتاكي 3 قطع", 6000, "1 " + N],
            ["كنتاكي 5 قطع", 10000, "2 " + N],
            ["كنتاكي 6 قطع", 12000, "2 " + N],
            ["كنتاكي 8 قطع", 15000, "3 " + N],
            ["كنتاكي 12 قطعة", 20000, "4 " + N],
          ],
        ],
        كرسبي: [
          "chicken",
          [
            ["كرسبي 4 قطع", 6000, "1 " + N],
            ["كرسبي 6 قطع", 10000, "2 " + N],
            ["كرسبي 8 قطع", 12000, "2 " + N],
            ["كرسبي 10 قطع", 15000, "3 " + N],
            ["كرسبي 12 قطعة", 18000, "4 " + N],
          ],
        ],
        الفنكر: [
          "fries",
          [
            ["قدح فنكر", 1000],
            ["ماعون فنكر وسط", 2000],
            ["ماعون فنكر كبير", 3000],
            ["ماعون فنكر بالجبن", 2500],
            ["ماعون فنكر هاني ماسترد", 2500],
            ["ماعون فنكر هالبينو سبايسي", 2500],
            ["باركود فرايز باللحم", 4000],
            ["كرسبي فرايز", 4000],
          ],
        ],
        الإيطالي: [
          "🌯",
          [
            ["لفم شاورما لحم وسط", 7000],
            ["لفم شاورما لحم كبير", 10000],
            ["لفم شاورما دجاج وسط", 7000],
            ["لفم شاورما دجاج كبير", 10000],
            ["سبشل إيطالي", 7000],
            ["صاج إيطالي لحم", 5000],
            ["صاج إيطالي دجاج", 4500],
          ],
        ],
        مقبلات: [
          "🥗",
          [
            ["مقبلات صغير", 1000],
            ["مقبلات وسط", 2000],
            ["مقبلات كبير", 3000],
          ],
        ],
        أجنحة: ["wings.jpeg", [["أجنحة باركود", 5000, "بصلصات مختلفة"]]],
      };
      const SZ = ["صغير", "وسط", "كبير"];

      // ============ أدوات ============
      const $ = (id) => document.getElementById(id),
        fmt = (n) => n.toLocaleString("en-US");
      const esc = (t) =>
        String(t)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      const hash = (s) =>
        [...s]
          .reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7)
          .toString(36);
      const ls = (k, v) => {
        try {
          if (v === undefined) return JSON.parse(localStorage.getItem(k));
          localStorage.setItem(k, JSON.stringify(v));
        } catch (_) {}
      };
      function say(t) {
        const e = $("toast");
        e.textContent = t;
        e.style.display = "block";
        clearTimeout(say.t);
        say.t = setTimeout(() => (e.style.display = "none"), 2200);
      }

      // ============ التقييم ============
      // R[key] = {s: مجموع النجوم, c: عدد المقيّمين} ، mine[key] = تقييمي أنا
      let R = FB.projectId ? {} : ls("bf_R") || {},
        mine = ls("bf_mine") || {},
        fs = null;
      const uid =
        ls("bf_uid") ||
        (() => {
          const u =
            Math.random().toString(36).slice(2) + Date.now().toString(36);
          ls("bf_uid", u);
          return u;
        })();
      function starsHTML(k) {
        const r = R[k],
          avg = r ? r.s / r.c : 0,
          shown = Math.round(avg);
        let h =
          '<div class="st" data-k="' +
          k +
          '" title="' +
          (mine[k] ? "تقييمك: " + mine[k] : "اضغط للتقييم") +
          '">';
        for (let i = 1; i <= 5; i++)
          h +=
            '<button data-s="' +
            i +
            '" class="' +
            (i <= shown ? "on" : "") +
            '" aria-label="' +
            i +
            '">★</button>';
        return (
          h +
          "<i>" +
          (r ? avg.toFixed(1) + " (" + r.c + ")" : "قيّم") +
          "</i></div>"
        );
      }
      async function rate(k, s) {
        const old = mine[k];
        R[k] = R[k] || { s: 0, c: 0 };
        if (old) R[k].s += s - old;
        else {
          R[k].s += s;
          R[k].c++;
        } // نفس الزائر = تقييم واحد يتحدّث
        mine[k] = s;
        ls("bf_mine", mine);
        if (!FB.projectId) ls("bf_R", R);
        document
          .querySelectorAll('.st[data-k="' + k + '"]')
          .forEach((e) => (e.outerHTML = starsHTML(k)));
        if (fs)
          try {
            await fs.f.setDoc(fs.f.doc(fs.db, "ratings", k + "_" + uid), {
              k,
              s,
            });
            say("شكراً لتقييمك ⭐");
          } catch (_) {
            say("تعذر حفظ التقييم بالقاعدة");
          }
        else say("شكراً لتقييمك ⭐");
      }
      (async () => {
        // اتصال Firebase (إذا مضبوط)
        if (!FB.projectId) return;
        try {
          const A =
            await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
          const f =
            await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
          fs = { f, db: f.getFirestore(A.initializeApp(FB)) };
          const snap = await f.getDocs(f.collection(fs.db, "ratings"));
          R = {};
          snap.forEach((d) => {
            const { k, s } = d.data();
            R[k] = R[k] || { s: 0, c: 0 };
            R[k].s += s;
            R[k].c++;
            if (d.id === k + "_" + uid) mine[k] = s;
          });
          show(cur);
        } catch (_) {}
      })();

      // ============ عرض المنيو ============
      let cur = Object.keys(M)[0];
      function card(cat, it, def) {
        const k = hash(cat + "|" + it[0]),
          img = it[3] || def,
          multi = Array.isArray(it[1]);
        const imageKey = /^[a-z]+(?:\.(?:webp|jpe?g|png))?$/i.test(img);
        const imageSrc = /\.[a-z]+$/i.test(img) ? img : img + ".webp";
        const pic = !imageKey
          ? "<span>" + img + "</span>"
          : '<img src="' +
            imageSrc +
            '" alt="' +
            esc(it[0]) +
            '" loading="lazy">';
        const firstPrice = multi ? it[1][0] : it[1];
        const firstName = multi ? it[0] + " (" + SZ[0] + ")" : it[0];
        const options = multi
          ? '<div class="sz">' +
            it[1]
              .map(
                (p, i) =>
                  '<button class="add" data-n="' +
                  esc(it[0] + " (" + SZ[i] + ")") +
                  '" data-p="' +
                  p +
                  '"><u>' +
                  SZ[i] +
                  "</u>" +
                  fmt(p) +
                  " د.ع +</button>",
              )
              .join("") +
            "</div>"
          : '<div class="pr">' + fmt(it[1]) + " د.ع</div>";
        return (
          '<article class="card" data-search="' +
          esc((it[0] + " " + (it[2] || "")).toLocaleLowerCase()) +
          '"><div class="ph">' +
          pic +
          '<button class="image-add add" data-n="' +
          esc(firstName) +
          '" data-p="' +
          firstPrice +
          '" aria-label="إضافة ' +
          esc(firstName) +
          '" title="إضافة للسلة">+</button></div><div class="bd2"><h3>' +
          esc(it[0]) +
          "</h3>" +
          (it[2] ? "<small>" + esc(it[2]) + "</small>" : "") +
          starsHTML(k) +
          '<div class="row">' +
          (multi ? options : '<div class="pr">' + fmt(it[1]) + " د.ع</div>") +
          "</div></div></article>"
        );
      }
      function show(c) {
        cur = c;
        const categories = Object.keys(M);
        const categoryImage = (key, cssClass) => {
          if (!/^[a-z]+(?:\.(?:webp|jpe?g|png))?$/i.test(key))
            return '<span class="' + cssClass + '">' + key + "</span>";
          const src = /\.[a-z]+$/i.test(key) ? key : key + ".webp";
          return (
            '<img class="' +
            cssClass +
            '" src="' +
            src +
            '" alt="" loading="lazy">'
          );
        };
        $("tabs").innerHTML =
          '<button class="category-tile all on" data-c="*" aria-label="كل الأقسام"><b>الكل</b></button>' +
          categories
            .map(
              (k) =>
                '<button class="category-tile" data-c="' +
                esc(k) +
                '">' +
                (/^[a-z]+(?:\.(?:webp|jpe?g|png))?$/i.test(M[k][0])
                  ? categoryImage(M[k][0], "")
                  : categoryImage(M[k][0], "tile-emoji")) +
                "<b>" +
                esc(k) +
                "</b></button>",
            )
            .join("");
        $("menu-sections").innerHTML = categories
          .map(
            (k) =>
              '<section class="menu-category" id="category-' +
              hash(k) +
              '" data-category="' +
              esc(k) +
              '"><div class="category-heading"><h3 class="category-name">' +
              categoryImage(M[k][0], "heading-emoji") +
              esc(k) +
              '</h3><span class="item-count">' +
              M[k][1].length +
              ' أصناف</span></div><div class="menu-list">' +
              M[k][1].map((it) => card(k, it, M[k][0])).join("") +
              "</div></section>",
          )
          .join("");
        applySearch();
      }
      $("tabs").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.c === "*") {
          setActive("*");
          $("menu").scrollIntoView({ behavior: "smooth" });
        } else {
          setActive(b.dataset.c);
          $("category-" + hash(b.dataset.c)).scrollIntoView({
            behavior: "smooth",
          });
        }
      };
      function setActive(category) {
        $("tabs")
          .querySelectorAll(".category-tile")
          .forEach((tile) =>
            tile.classList.toggle("on", tile.dataset.c === (category || "*")),
          );
      }
      let sectionObserver;
      function observeCategories() {
        if (sectionObserver) sectionObserver.disconnect();
        if (!("IntersectionObserver" in window)) return;
        sectionObserver = new IntersectionObserver(
          () => {
            const sections = [
              ...document.querySelectorAll(".menu-category:not([hidden])"),
            ];
            const line = 220;
            const active =
              sections.find((section) => {
                const rect = section.getBoundingClientRect();
                return rect.top <= line && rect.bottom > line;
              }) ||
              sections.find(
                (section) => section.getBoundingClientRect().top > line,
              );
            if (active) setActive(active.dataset.category);
            else if (window.scrollY < $("menu").offsetTop) setActive("*");
          },
          { rootMargin: "-180px 0px -55% 0px", threshold: 0 },
        );
        document
          .querySelectorAll(".menu-category:not([hidden])")
          .forEach((section) => sectionObserver.observe(section));
      }
      function applySearch() {
        const query = $("menu-search").value.trim().toLocaleLowerCase();
        let matches = 0;
        document.querySelectorAll(".menu-category").forEach((section) => {
          let count = 0;
          section.querySelectorAll(".card").forEach((item) => {
            const visible = item.dataset.search.includes(query);
            item.hidden = !visible;
            if (visible) count++;
          });
          section.hidden = count === 0;
          section.querySelector(".item-count").textContent = count + " أصناف";
          matches += count;
        });
        $("no-results").hidden = matches > 0;
        $("tabs")
          .querySelectorAll(".category-tile[data-c]")
          .forEach((tile) => {
            tile.hidden =
              tile.dataset.c !== "*" &&
              !$("category-" + hash(tile.dataset.c)).matches(":not([hidden])");
          });
        if (!$("tabs").querySelector(".category-tile.on:not([hidden])"))
          setActive("*");
        observeCategories();
      }
      $("menu-search").addEventListener("input", applySearch);
      $("offers-box").innerHTML = OFFERS.map((o) => {
        const discount = o[4] ? Math.round(((o[4] - o[2]) / o[4]) * 100) : 0;
        return (
          '<article class="of"><div class="offer-picture"><img src="' +
          o[3] +
          '" alt="' +
          esc(o[0]) +
          '" loading="lazy">' +
          (discount > 0
            ? '<span class="discount">-' + discount + "%</span>"
            : "") +
          '</div><div class="bd"><h3>' +
          esc(o[0]) +
          "</h3><small>" +
          esc(o[1]) +
          '</small><div class="offer-bottom"><span><b>' +
          fmt(o[2]) +
          " د.ع</b>" +
          (o[4] ? '<del class="old-price">' + fmt(o[4]) + " د.ع</del>" : "") +
          '</span><button class="offer-add add" data-n="' +
          esc("عرض: " + o[0]) +
          '" data-p="' +
          o[2] +
          '">أضف للسلة</button></div></div></article>'
        );
      }).join("");
      $("restaurant-name").textContent = CFG.name;
      $("delivery-chip").hidden = !CFG.deliveryMin;
      $("delivery-chip").textContent = CFG.deliveryMin
        ? "التوصيل ~ " + CFG.deliveryMin + " د"
        : "";
      $("minimum-chip").hidden = !CFG.minOrder;
      $("minimum-chip").textContent = CFG.minOrder
        ? "الحد الأدنى " + fmt(+CFG.minOrder) + " د.ع"
        : "";
      $("slide-dots").innerHTML = [...$("banner").querySelectorAll(".slide")]
        .map(
          (_, i) =>
            '<button class="' +
            (i === 0 ? "on" : "") +
            '" aria-label="الشريحة ' +
            (i + 1) +
            '" data-slide="' +
            i +
            '"></button>',
        )
        .join("");
      const slides = [...$("banner").querySelectorAll(".slide")];
      let slideIndex = 0;
      function showSlide(index) {
        slideIndex = index % slides.length;
        slides.forEach((slide, i) =>
          slide.classList.toggle("on", i === slideIndex),
        );
        $("slide-dots")
          .querySelectorAll("button")
          .forEach((dot, i) => dot.classList.toggle("on", i === slideIndex));
      }
      $("slide-dots").onclick = (e) => {
        const dot = e.target.closest("button");
        if (dot) showSlide(+dot.dataset.slide);
      };
      setInterval(() => showSlide(slideIndex + 1), 4000);
      $("addr").textContent = CFG.address;
      $("phones").innerHTML = CFG.phones
        .map(
          (p) =>
            '<a href="tel:' + encodeURIComponent(p) + '">' + esc(p) + "</a>",
        )
        .join("");
      const socialLink = (icon, href, label, className = "") =>
        '<a class="social-link' +
        (className ? " " + className : "") +
        '" href="' +
        href +
        '" aria-label="' +
        label +
        '" title="' +
        label +
        '"' +
        (href.startsWith("http") ? ' target="_blank" rel="noopener"' : "") +
        ">" +
        icon +
        "</a>";
      const mapHref =
        CFG.mapUrl ||
        (CFG.mapQuery
          ? "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(CFG.mapQuery)
          : "");
      $("contact-links").innerHTML =
        (CFG.phones[0]
          ? socialLink("☎", "tel:" + encodeURIComponent(CFG.phones[0]), "اتصال")
          : "") +
        (CFG.tiktok
          ? socialLink(
              "♪",
              "https://www.tiktok.com/@" + encodeURIComponent(CFG.tiktok),
              "تيك توك",
            )
          : "") +
        (CFG.facebook
          ? socialLink(
              "f",
              "https://www.facebook.com/" + encodeURIComponent(CFG.facebook),
              "فيسبوك",
            )
          : "") +
        (CFG.insta
          ? socialLink(
              "◎",
              "https://instagram.com/" + encodeURIComponent(CFG.insta),
              "انستغرام",
            )
          : "") +
        (CFG.wa
          ? socialLink(
              "◉",
              "https://wa.me/" + encodeURIComponent(CFG.wa),
              "واتساب",
              "whatsapp",
            )
          : "") +
        (mapHref
          ? socialLink("⌖", mapHref, "الموقع على الخريطة", "location")
          : "");
      show(cur);

      // ============ السلة ============
      let cart = ls("bf_cart") || {};
      function draw() {
        const ks = Object.keys(cart);
        let t = 0,
          c = 0;
        $("items").innerHTML = ks.length
          ? ks
              .map((k) => {
                const i = cart[k];
                t += i.p * i.q;
                c += i.q;
                return (
                  '<div class="ci"><div>' +
                  esc(k) +
                  "<small>" +
                  fmt(i.p) +
                  ' د.ع</small></div><div class="qt"><button data-a="-1" data-k="' +
                  esc(k) +
                  '">−</button><b>' +
                  i.q +
                  '</b><button data-a="1" data-k="' +
                  esc(k) +
                  '">+</button></div></div>'
                );
              })
              .join("")
          : '<p style="opacity:.6;text-align:center;padding:20px">السلة فارغة</p>';
        $("tot").textContent = fmt(t);
        $("cnt").textContent = c;
        $("form").style.display = ks.length ? "block" : "none";
        ls("bf_cart", cart);
      }
      draw();
      document.addEventListener("click", (e) => {
        const s = e.target.closest(".st button");
        if (s) return rate(s.parentElement.dataset.k, +s.dataset.s);
        const b = e.target.closest(".add");
        if (b) {
          const k = b.dataset.n;
          cart[k] = cart[k] || { p: +b.dataset.p, q: 0 };
          cart[k].q++;
          draw();
          return say("تمت الإضافة للسلة 🛒");
        }
        const q = e.target.closest(".qt button");
        if (q) {
          const k = q.dataset.k;
          cart[k].q += +q.dataset.a;
          if (cart[k].q <= 0) delete cart[k];
          draw();
        }
      });
      $("cartbtn").onclick = () => $("cart").classList.add("open");
      $("cx").onclick = () => $("cart").classList.remove("open");
      $("cart").onclick = (e) => {
        if (e.target === $("cart")) $("cart").classList.remove("open");
      };
      $("send").onclick = () => {
        const v = (id) => $(id).value.trim(),
          ks = Object.keys(cart);
        if (!ks.length) return;
        if (!v("fn") || !v("fa")) return say("اكتب الاسم والمنطقة");
        if (v("fp").length < 10) return say("اكتب رقم هاتف صحيح");
        let t = 0;
        const lines = ks.map((k) => {
          const i = cart[k];
          t += i.p * i.q;
          return "• " + k + " × " + i.q + " = " + fmt(i.p * i.q);
        });
        const m = [
          "طلب جديد من " + CFG.name,
          "",
          "الاسم: " + v("fn"),
          "الهاتف: " + v("fp"),
          "المنطقة: " + v("fa"),
          "أقرب نقطة دالة: " + (v("fl") || "-"),
          "",
          "الطلب:",
          ...lines,
          "",
          "المجموع: " + fmt(t) + " د.ع",
        ];
        if (v("fz")) m.push("", "ملاحظات: " + v("fz"));
        window.open(
          "https://wa.me/" +
            CFG.wa +
            "?text=" +
            encodeURIComponent(m.join("\n")),
          "_blank",
        );
        say("اضغط إرسال بواتساب لإتمام الطلب");
      };
      $("fp").addEventListener("input", (e) => {
        e.target.value = e.target.value
          .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
          .replace(/\D/g, "");
      });
    </script>
  </body>
</html>
